{% extends "base.html" %}
{% block title %}Reset password -- MusicLounge{% endblock %}
{% block content %}
{% include "partials/_wordmark.html" %}
<div class="card surface-hi" style="max-width: 400px; margin: 60px auto;">
  <h2 style="margin-bottom: 18px;">Set a new password</h2>
  {% if error %}<p style="color: var(--orange-deep); font-weight:700; margin-bottom:14px;">{{ error }}</p>{% endif %}
  <form method="post" style="display:flex; flex-direction:column; gap:14px;">
    <input type="password" name="password" placeholder="New password (min 8 characters)" autofocus>
    <input type="password" name="confirm" placeholder="Confirm new password">
    <button type="submit" class="btn btn-primary">Set new password</button>
  </form>
</div>
{% endblock %}
