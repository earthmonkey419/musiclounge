{% extends "base.html" %}
{% block title %}MusicLounge -- Admin Login{% endblock %}
{% block content %}
{% include "partials/_wordmark.html" %}
<div class="card surface-hi" style="max-width: 360px; margin: 60px auto;">
  <h2 style="margin-bottom: 18px;">Host login</h2>
  {% if error %}<p style="color: var(--orange-deep); font-weight:700; margin-bottom:14px;">{{ error }}</p>{% endif %}
  <form method="post" style="display:flex; flex-direction:column; gap:14px;">
    <input type="password" name="password" placeholder="Admin password" autofocus>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p style="text-align:center; margin-top:16px; margin-bottom:0;">
    <a href="{{ url_for('admin.forgot_password') }}" style="color:var(--ink-soft); font-size:13px;">Forgot password?</a>
  </p>
</div>
{% endblock %}
