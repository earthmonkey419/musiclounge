<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Background Mint Canvas Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#80fada"/>
      <stop offset="60%" stop-color="#70ffd2"/>
      <stop offset="100%" stop-color="#52eecc"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1200" fill="url(#bgGlow)"/>

  <!-- Subtle Jukebox Graphic Container -->
  <g opacity="0.35" transform="translate(150, 80)">

    <!-- Outer Yellow Arch Body -->
    <path d="M 50 1100 L 50 350 A 300 300 0 0 1 650 350 L 650 1100 Z" fill="#FFCC4D"/>

    <!-- Top Orange Center Accent Stripe -->
    <rect x="310" y="50" width="80" height="120" fill="#FF9137"/>

    <!-- Horizontal Orange Trim Bands -->
    <rect x="50" y="420" width="600" height="40" fill="#FF9137"/>
    <rect x="50" y="1020" width="600" height="40" fill="#FF9137"/>

    <!-- Inner Dark Frame (Inner Arch Body) -->
    <path d="M 175 1100 L 175 275 A 175 175 0 0 1 525 275 L 525 1100 Z" fill="#2d3732"/>

    <!-- Upper Arch Window (Light Yellow) -->
    <path d="M 230 420 L 230 290 A 120 120 0 0 1 470 290 L 470 420 Z" fill="#FFFC8C"/>

    <!-- Middle Display Bar (Warm Yellow) -->
    <rect x="230" y="450" width="240" height="100" fill="#FFCC4D"/>

    <!-- Lower Glass Tube Arch (Mint / Light Neutral Fill) -->
    <path d="M 230 600 L 230 840 A 120 120 0 0 0 470 840 L 470 600 Z" fill="#70FFD2"/>
    <path d="M 280 600 L 280 820 A 70 70 0 0 0 420 820 L 420 600 Z" fill="#2d3732"/>

  </g>
</svg>
